# Scitulus —— 让盔甲纹饰（锻造模板 + 锻造材料）真正有价值
#
# 全部效果都建立在原版机制上（attribute_modifiers / 药水效果 / 原版事件），
# 没有新增方块、物品、纹理或配方；纹饰本身就是原版的 11 种材料 × 18 种模板。

# 总开关。关闭后不注册定时任务（已刻进物品的材料属性仍会留在物品上）。
enabled: true

# 动态效果刷新间隔（tick）。越小越跟手，越大越省性能。
# 涉及"潜行 / 疾跑 / 入水 / 饱和度"这类条件判断与玩家级属性挂载。
refresh-interval-ticks: 5

# 是否把「材料」加成直接刻进盔甲物品的 attribute_modifiers 组件。
# 这样它会像原版护甲值一样自动生效并显示在物品提示里；
# 关闭后材料加成将改为挂在玩家身上（提示里不再显示）。
stamp-item-attributes: true

# 是否输出调试日志。
debug: false
